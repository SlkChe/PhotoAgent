name: photoagent-local

services:
  ingress:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    ports:
      - "192.168.7.100:${PHOTO_HTTPS_PORT:-443}:8443"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - type: bind
        source: ./ingress/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../.devsec/ssl/dev
        target: /certs/dev
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../.devsec/ssl/stage
        target: /certs/stage
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [stage]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8443"]
      interval: 10s
      timeout: 3s
      retries: 3

  stage-api:
    profiles: [stage]
    build:
      context: ..
      dockerfile: docker/core-api.Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [stage]

  stage-ui:
    profiles: [stage]
    build:
      context: ..
      dockerfile: docker/streamlit-ui.Dockerfile
    environment:
      PHOTO_UI_BACKEND_URL: http://stage-api:8000
      PHOTO_UI_PUBLIC_BACKEND_URL: https://photoagent-stage.home.arpa
    depends_on:
      stage-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [stage]

networks:
  stage:
